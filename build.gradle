plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

allprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'
    apply plugin: 'idea'
    repositories {
        mavenLocal()
        maven {
            url "https://maven.aliyun.com/repository/public"
        }
        mavenCentral()
    }
    java {
        sourceCompatibility = '21'
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.encoding = "UTF-8"
        }
    }

}
subprojects {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        // 引入 webflux 依赖仅为了使用 WebClient
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        // jwt
        implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

        implementation 'org.apache.commons:commons-pool2:2.12.0'
        implementation 'com.mysql:mysql-connector-j:8.4.0'
        implementation 'com.alibaba:druid-spring-boot-starter:1.2.22'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
        implementation 'com.google.guava:guava:33.1.0-jre'
        implementation 'org.apache.commons:commons-lang3:3.14.0'
        implementation 'commons-io:commons-io:2.16.1'
        implementation 'cn.hutool:hutool-captcha:5.8.32'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'io.projectreactor:reactor-test'

        implementation 'org.redisson:redisson:3.52.0'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
    jar {
        manifest {
            attributes 'Main-Class': 'com.gilgamesh.GilgameshRestApplication'
        }
    }
}


