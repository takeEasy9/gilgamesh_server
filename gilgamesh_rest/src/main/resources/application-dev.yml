server:
  port: 8000
  # 启用优雅停机(默认 immediate：立即关闭)
  shutdown: graceful
  lifecycle:
    # 优雅停机等待超时时间(所有任务必须在该时间内完成，否则强制关闭)
    timeout-per-shutdown-phase: 40s
spring:
  main:
    allow-circular-references: false
  web:
    resources:
      add-mappings: false
  jpa:
    show-sql: true
    format-sql: true
    hibernate:
      # 不会对数据库进行任何验证和操作
      ddl-auto: none
    open-in-view: false
  datasource:
    druid:
      mysql:
        gilgamesh:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.96.233:3306/gilgamesh?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowMultiQueries=true&rewriteBatchedStatements=true
          username: root
          password:
          # 初始连接数
          initialSize: 5
          # 最小连接池数量
          minIdle: 10
          # 最大连接池数量
          maxActive: 20
          # 配置获取连接等待超时的时间
          maxWait: 60000
          # 配置连接超时时间
          connectTimeout: 30000
          # 配置网络超时时间
          socketTimeout: 60000
          # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
          timeBetweenEvictionRunsMillis: 60000
          # 配置一个连接在池中最小生存的时间，单位是毫秒
          minEvictableIdleTimeMillis: 300000
          # 配置一个连接在池中最大生存的时间，单位是毫秒
          maxEvictableIdleTimeMillis: 900000
          # 配置检测连接是否有效
          validationQuery: SELECT 1 FROM DUAL
          validationQueryTimeout: 10000
          poolPreparedStatements: false
          testWhileIdle: true
          testOnBorrow: false
          testOnReturn: false
          keepAlive: true
          filters: stat,slf4j

  data:
    # redis
    redis:
      # 服务器地址
      host: 192.168.96.233
      # 服务器端口
      port: 6379
      # 数据库密码
      password:
      # 数据库索引,默认为0
      database: 0
      client-type: lettuce
      timeout: 3000 # 连接超时(3秒，避免无限等待)
      lettuce:
        pool:
          max-idle: 8 # 最大空闲连接数, 保留合理空闲连接，避免频繁创建
          min-idle: 2 # 最小空闲连接数, 预热核心连接，提升响应速度
          max-wait: 5000 # 最大等待时间 5秒, 避免线程阻塞过久
          max-active: 16 #最大活跃连接数
        shutdown-timeout: 3000 # 关闭超时, 3秒, 确保连接优雅关闭，避免资源泄露
spring-doc:
  api-docs:
    # 是否开启接口文档
    enabled: true
    # OpenAPI文档的路径
    path: /api-docs
  swagger-ui:
    # 是否开启 swagger ui
    enabled: true
    # swagger-ui路径
    path: /swagger-ui.html
    # 持久化认证数据
    persistAuthorization: true
  # 扫描包路径
  packages-to-scan: com.gilgamesh.rest
web:
  security:
    captcha:
      expire-in-seconds: 180
    jwt:
      header: Authorization
      token-head: "Bearer "
      # jwt 签名rsa公钥
      sign-rsa-public-key:
      # jwt 签名rsa公钥
      sign-rsa-private-key:
      # jwt 签名 ECDSA-256 公钥
      sign-ecdsa-public-key:
      # jwt 签名 ECDSA-256 私钥
      sign-ecdsa-private-key:
      # access token 有效期(毫秒), 30分钟
      access-token-expire-ms: 1800000
      # refresh token (毫秒) 7 天
      refresh-token-expire-ms: 604800000
      # refresh token 续期次数
      max-rt-exchange-times: 10
      # access token 续期阈值(毫秒) 1分钟
      at-expire-threshold-ms: 60000
      # refresh token 续期阈值(毫秒) 3分钟
      rt-expire-threshold-ms: 180000

    interceptor:
      white-list: [ /static/**, /api/gilgamesh/v1/login, /api/verifyCode/captcha, /api/gilgamesh/v1/image/captcha, /index.html, /api-docs, /api-docs/**, /swagger-ui/** ]
      login-api: '/api/gilgamesh/v1/login'
    policy:
      content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; font-src 'self' data:"
      web-feature-policy: "geolocation 'none'; midi 'none'; sync-xhr 'none'; microphone 'none'; camera 'none'; magnetometer 'none'; gyroscope 'none'; fullscreen 'self'; payment 'none'"

# 线程池核心配置(自定义前缀，便于区分)
thread-pool:
  # 1. 核心线程数(核心池大小，默认5)：线程池长期维持的最小线程数，即使空闲也不会销毁
  core-pool-size: 7
  # 2. 最大线程数(默认Integer.MAX_VALUE)：线程池允许创建的最大线程数
  max-pool-size: 20
  # 3. 队列容量(默认Integer.MAX_VALUE)：任务队列的最大容量，核心线程满时先入队
  queue-capacity: 1000
  # 4. 空闲线程存活时间(默认60秒)：非核心线程空闲超过该时间会被销毁
  keep-alive-seconds: 60
  # 5. 拒绝策略(默认AbortPolicy)：队列满+最大线程数满时，新任务的处理策略
  # 可选值：abort(抛异常)、caller-runs(调用者线程执行)、discard(丢弃任务)、discard-oldest(丢弃队列最老任务)
  # rejection-policy: caller-runs
  # 6. 线程名称前缀(自定义，便于日志排查)
  # thread-name-prefix: "gilgamesh-prim-thread-"
  # 7. 是否允许核心线程超时(默认false)：核心线程空闲时是否销毁(true=允许，false=不允许)
  allow-core-thread-timeout: false
  # 8. 容器关闭时是否等待任务完成(默认false)
  wait-for-tasks-to-complete-on-shutdown: true
  # 9. 等待任务完成的最大超时时间(单位：秒，默认0=无限等待)
  await-termination-seconds: 40

# RestClient 连接池配置
rest-client:
  pool:
    # 连接池基础配置
    pool:
      max-conn-total: 200        # 最大总连接数
      max-conn-per-route: 50     # 单路由最大连接数
      connection-wait-queue-length: 100 # 连接池等待队列长度
      idle-conn-evict-min: 5     # 空闲连接清理间隔（分钟）
      conn-validate-after-inactivity-sec: 30 # 空闲连接校验（秒）
    # 超时配置
    timeout:
      connect-timeout-sec: 5     # 连接超时（秒）
      socket-timeout-sec: 15     # 读取超时（秒）
      connection-request-timeout-sec: 3 # 连接池获取超时（秒）
    # Keep-Alive 配置
    keep-alive:
      conn-time-to-live-min: 30  # 连接最大存活时长（分钟）
      keep-alive-timeout-min: 10 # Keep-Alive 超时（分钟）
      keep-alive-header: "timeout=60, max=1000" # Keep-Alive 请求头参数





